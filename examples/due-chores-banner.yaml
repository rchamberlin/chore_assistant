# Due / overdue chores banner (Lovelace card)
#
# A dashboard banner that appears above your person cards whenever a chore is
# due tomorrow, due today, or overdue — and hides itself otherwise. It lists
# EVERY such chore (grouped overdue → today → tomorrow), coloured by the
# highest severity present.
#
#   yellow  (#fdd835)  something is due tomorrow (nothing sooner)
#   orange  (#fb8c00)  something is due today
#   red     (#e53935)  something is overdue             (highest wins)
#
# Data source: each `sensor.*_overdue_chores` entity this integration creates
# exposes an `items` attribute — a list of {chore_id, name, due} for that
# member's open chores. New members are picked up automatically.
#
# Requirements:
#   - card_mod (HACS "lovelace-card-mod") for the templated background colour.
#   - The integration's sensor must expose `items` (HA restart after upgrading).
#
# Install: paste the LIVE CARD below as the first card in your view, above the
# person cards. The STATIC PREVIEW (commented, at the bottom) forces the banner
# visible so you can check the styling before anything is actually due.

###############################################################################
# LIVE CARD — use this one.
###############################################################################
type: markdown
visibility:
  - condition: template
    value_template: >-
      {%- set ids = states.sensor | map(attribute='entity_id') | select('match', '.*_overdue_chores$') | list -%}
      {%- set tmrw = (now() + timedelta(days=1)).date().isoformat() -%}
      {%- set ns = namespace(hit=false) -%}
      {%- for id in ids -%}
        {%- for item in state_attr(id, 'items') or [] -%}
          {%- if (item['due'] | string)[:10] <= tmrw %}{% set ns.hit = true %}{% endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ ns.hit }}
content: >-
  {%- set ids = states.sensor | map(attribute='entity_id') | select('match', '.*_overdue_chores$') | list -%}
  {%- set tdy = now().date().isoformat() -%}
  {%- set tmrw = (now() + timedelta(days=1)).date().isoformat() -%}
  {%- set ns = namespace(overdue=[], today=[], tomorrow=[]) -%}
  {%- for id in ids -%}
    {%- set member = state_attr(id, 'friendly_name') | replace(' overdue chores', '') -%}
    {%- for item in state_attr(id, 'items') or [] -%}
      {%- set due = (item['due'] | string)[:10] -%}
      {%- if due < tdy -%}
        {%- set ns.overdue = ns.overdue + [(member, item['name'])] -%}
      {%- elif due == tdy -%}
        {%- set ns.today = ns.today + [(member, item['name'])] -%}
      {%- elif due == tmrw -%}
        {%- set ns.tomorrow = ns.tomorrow + [(member, item['name'])] -%}
      {%- endif -%}
    {%- endfor -%}
  {%- endfor -%}
  {%- if ns.overdue -%}
    {%- set head = '### 🔴 ' ~ (ns.overdue | count) ~ ' chore' ~ ('s' if ns.overdue | count > 1 else '') ~ ' overdue' -%}
  {%- elif ns.today -%}
    {%- set head = '### 🟠 ' ~ (ns.today | count) ~ ' chore' ~ ('s' if ns.today | count > 1 else '') ~ ' due today' -%}
  {%- else -%}
    {%- set head = '### 🟡 ' ~ (ns.tomorrow | count) ~ ' chore' ~ ('s' if ns.tomorrow | count > 1 else '') ~ ' due tomorrow' -%}
  {%- endif -%}
  {%- set out = namespace(lines=[head]) -%}
  {%- for e in ns.overdue -%}
    {%- set out.lines = out.lines + ['- **' ~ e[0] ~ ':** ' ~ e[1] ~ ' — overdue'] -%}
  {%- endfor -%}
  {%- for e in ns.today -%}
    {%- set out.lines = out.lines + ['- **' ~ e[0] ~ ':** ' ~ e[1] ~ ' — due today'] -%}
  {%- endfor -%}
  {%- for e in ns.tomorrow -%}
    {%- set out.lines = out.lines + ['- **' ~ e[0] ~ ':** ' ~ e[1] ~ ' — due tomorrow'] -%}
  {%- endfor -%}
  {{ out.lines | join('\n') }}
card_mod:
  style: |
    ha-card {
      {% set ids = states.sensor | map(attribute='entity_id') | select('match', '.*_overdue_chores$') | list %}
      {% set tdy = now().date().isoformat() %}
      {% set ns = namespace(overdue=0, today=0) %}
      {% for id in ids %}
        {% for item in state_attr(id, 'items') or [] %}
          {% set due = (item['due'] | string)[:10] %}
          {% if due < tdy %}{% set ns.overdue = ns.overdue + 1 %}
          {% elif due == tdy %}{% set ns.today = ns.today + 1 %}{% endif %}
        {% endfor %}
      {% endfor %}
      background: {% if ns.overdue > 0 %}#e53935{% elif ns.today > 0 %}#fb8c00{% else %}#fdd835{% endif %} !important;
    }
    ha-card, ha-card ha-markdown, ha-card h3 {
      color: #1b1b1b !important;
    }

