# Due / overdue chores banner (Lovelace card)
#
# A dashboard banner that appears above your person cards whenever a chore is
# due tomorrow, due today, or overdue — and hides itself otherwise.
#
#   yellow  (#fdd835)  a chore is due tomorrow
#   orange  (#fb8c00)  a chore is due today
#   red     (#e53935)  a chore is overdue        (highest severity wins)
#
# It scans every `sensor.*_overdue_chores` entity (the per-member sensors this
# integration creates), so new members are picked up automatically with no
# edits here. (We match on entity_id rather than filtering the attributes dict,
# because selectattr through `.attributes` fails in HA's template sandbox.)
#
# Requirements:
#   - card_mod (HACS "lovelace-card-mod") for the templated background colour.
#
# Install:
#   Paste the first card below as the FIRST card in your view, above the
#   person cards. The second card (clearly marked) is a static preview that
#   forces the banner visible so you can check the styling before anything is
#   actually due.

###############################################################################
# LIVE CARD — use this one.
###############################################################################
type: markdown
visibility:
  - condition: template
    value_template: >-
      {%- set ids = states.sensor | map(attribute='entity_id') | select('match', '.*_overdue_chores$') | list -%}
      {%- set tmrw = (now() + timedelta(days=1)).date().isoformat() -%}
      {%- set ns = namespace(overdue=0, today=0, tomorrow=0) -%}
      {%- for id in ids -%}
        {%- set ns.overdue = ns.overdue + (states(id) | int(0)) -%}
        {%- set ns.today = ns.today + (state_attr(id, 'due_today') | int(0)) -%}
        {%- set nd = state_attr(id, 'next_due') -%}
        {%- if nd and nd[:10] == tmrw %}{% set ns.tomorrow = ns.tomorrow + 1 %}{% endif -%}
      {%- endfor -%}
      {{ ns.overdue > 0 or ns.today > 0 or ns.tomorrow > 0 }}
content: >-
  {%- set ids = states.sensor | map(attribute='entity_id') | select('match', '.*_overdue_chores$') | list -%}
  {%- set tdy = now().date().isoformat() -%}
  {%- set tmrw = (now() + timedelta(days=1)).date().isoformat() -%}
  {%- set ns = namespace(overdue=0, today=0, tomorrow=0, lines=[]) -%}
  {%- for id in ids -%}
    {%- set ns.overdue = ns.overdue + (states(id) | int(0)) -%}
    {%- set ns.today = ns.today + (state_attr(id, 'due_today') | int(0)) -%}
    {%- set nd = state_attr(id, 'next_due') -%}
    {%- if nd and nd[:10] == tmrw %}{% set ns.tomorrow = ns.tomorrow + 1 %}{% endif -%}
  {%- endfor -%}
  {%- if ns.overdue > 0 -%}
    {%- set ns.lines = ['### 🔴 ' ~ ns.overdue ~ ' chore' ~ ('s' if ns.overdue > 1 else '') ~ ' overdue'] -%}
  {%- elif ns.today > 0 -%}
    {%- set ns.lines = ['### 🟠 ' ~ ns.today ~ ' chore' ~ ('s' if ns.today > 1 else '') ~ ' due today'] -%}
  {%- else -%}
    {%- set ns.lines = ['### 🟡 ' ~ ns.tomorrow ~ ' chore' ~ ('s' if ns.tomorrow > 1 else '') ~ ' due tomorrow'] -%}
  {%- endif -%}
  {%- for id in ids -%}
    {%- set name = state_attr(id, 'friendly_name') | replace(' overdue chores', '') -%}
    {%- set od = states(id) | int(0) -%}
    {%- set nd = state_attr(id, 'next_due') -%}
    {%- set chore = state_attr(id, 'next_chore') -%}
    {%- if od > 0 -%}
      {%- set ns.lines = ns.lines + ['- **' ~ name ~ ':** ' ~ chore ~ ' — overdue'] -%}
    {%- elif nd and nd[:10] == tdy -%}
      {%- set ns.lines = ns.lines + ['- **' ~ name ~ ':** ' ~ chore ~ ' — due today'] -%}
    {%- elif nd and nd[:10] == tmrw -%}
      {%- set ns.lines = ns.lines + ['- **' ~ name ~ ':** ' ~ chore ~ ' — due tomorrow'] -%}
    {%- endif -%}
  {%- endfor -%}
  {{ ns.lines | join('\n') }}
card_mod:
  style: |
    ha-card {
      {% set ids = states.sensor | map(attribute='entity_id') | select('match', '.*_overdue_chores$') | list %}
      {% set ns = namespace(overdue=0, today=0) %}
      {% for id in ids %}
        {% set ns.overdue = ns.overdue + (states(id) | int(0)) %}
        {% set ns.today = ns.today + (state_attr(id, 'due_today') | int(0)) %}
      {% endfor %}
      background: {% if ns.overdue > 0 %}#e53935{% elif ns.today > 0 %}#fb8c00{% else %}#fdd835{% endif %} !important;
    }
    ha-card, ha-card ha-markdown, ha-card h3 {
      color: #1b1b1b !important;
    }

